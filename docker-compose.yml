services:
  noga:
    build: .
    image: eladzazon/noga-whatsapp-assistant:latest
    container_name: noga-assistant
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      # Persistent data (SQLite + WhatsApp session)
      - noga-data:/app/data
      # Logs on their own volume — different lifecycle/backup policy than the DB/session,
      # keeps rotation and high-frequency writes off the same mount as the SQLite file.
      - noga-logs:/app/data/logs
      # Mount credentials folder
      - ./credentials:/app/credentials:ro
      # Environment file
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - TZ=America/New_York
    networks:
      - proxy-network
    # Limit resources
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  noga-data:
    driver: local
  noga-logs:
    driver: local

networks:
  proxy-network:
    external: true
